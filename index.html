<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 760px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            text-align: center;
            margin-bottom: 12px;
        }

        .game-info h2 {
            color: #333;
            font-size: 1.3em;
        }

        .winner {
            color: #00fd6a !important;
        }

        .ai-progress-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto 18px auto;
        }

        .progress-wrapper {
            background: #e9ecef;
            height: 10px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
        }

        .progress-wrapper.empty {
            height: 6px;
            background: transparent;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s linear;
        }

        .mega-board {
            display: grid;
            grid-template-columns: repeat(3, 180px);
            grid-template-rows: repeat(3, 180px);
            gap: 10px;
            margin-bottom: 18px;
            background: #333;
            padding: 10px;
            border-radius: 10px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .small-board {
            background: rgb(204, 204, 204);
            border-radius: 8px;
            padding: 8px;
            position: relative;
            width: 180px;
            height: 180px;
            box-sizing: border-box;
        }

        .small-board.active {
            background: white;
            outline: 3px solid #3498db;
            outline-offset: -3px;
        }

        .small-board.playable {
            background: white;
            outline: 3px solid #3498db;
            outline-offset: -3px;
        }

        .small-board.won {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .board-winner {
            font-size: 5em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cells {
            display: grid;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(3, 52px);
            gap: 4px;
            width: 164px;
            height: 164px;
        }

        .cell {
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1.8em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
            color: #333;
            width: 52px;
            height: 52px;
            box-sizing: border-box;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            background: #e0e0e0;
        }

        .cell:active {
            background: #d0d0d0;
        }

        .reset-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 14px;
        }

        .reset-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .reset-button:active {
            transform: translateY(0);
        }

        .ai-controls {
            width: 100%;
            max-width: 420px;
            margin: 0 auto 18px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .ai-input {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f6f8fb;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #e3e6ea;
        }

        .ai-input input[type="number"] {
            width: 64px;
            padding: 8px;
            border: 1px solid #dde3ef;
            border-radius: 6px;
            font-size: 1em;
            text-align: right;
            background: white;
        }

        .seconds-label {
            color: #555;
            font-weight: 600;
        }

        .ai-play-button {
            padding: 10px 18px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .ai-play-button[disabled] {
            opacity: 0.6;
            cursor: default;
        }

        .ai-play-button:hover:not([disabled]) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(118,75,162,0.18);
        }

        .rules {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .rules h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .rules p {
            color: #555;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .cell {
                font-size: 1.2em;
            }

            .board-winner {
                font-size: 3em;
            }

            .ai-controls {
                max-width: 100%;
                padding: 0 8px;
            }
        }
    </style>
</head>
<body>
</body>
</html>
