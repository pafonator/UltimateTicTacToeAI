[package]
name = "UltimateTicTacToe"
version = "0.1.0"
edition = "2021"

# Main binary (your app)
[[bin]]
name = "uttt_game"  # Should match package name
path = "src/main.rs"

# Worker binary (runs in Web Worker)
[[bin]]
name = "ai_worker"
path = "src/bin/ai_worker.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lazy_static = "1.5.0"
env_logger = "0.11.9"
log = "0.4"
ahash = "0.8.11"
bitvec = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minimax ="0.5.4"

# Leptos web framework dependencies
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
gloo-worker = "0.5.0"
gloo-timers = { version = "0.3.0", features = ["futures"] }
wasm-logger = "0.2"
web-sys = { version = "0.3", features = ["Performance"] }

[profile.dev]
debug = true
opt-level = 3         
lto = false           # Disable Link-Time Optimization
panic = "abort"       # Faster builds without unwinding
incremental = true    # Enable incremental compilation

[profile.release]
opt-level = 3
debug = true
lto = true

[profile.test]
opt-level = 0          # Disable optimizations for tests
debug = true           # Include debug information
overflow-checks = true # Ensure integer overflow checks
lto = false            # Disable Link-Time Optimization
panic = "unwind"       # Keep unwinding for better test backtraces
incremental = true     # Enable incremental compilation
